<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Retromedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-body: #070709;
            --primary-red: #ff0520;
            --primary-glow: rgba(255, 5, 32, 0.45);
            --text-dim: #8e8e93;
        }

        body {
            background-color: var(--bg-body);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(7,7,9,0.7), rgba(7,7,9,0.95)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        
        .login-card {
            background-color: rgba(14, 14, 18, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px var(--primary-glow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .brand-title {
            color: var(--primary-red);
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 12px var(--primary-glow);
        }
        
        .form-control {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 0 12px 12px 0;
        }
        .form-control:focus {
            background-color: #000;
            border-color: var(--primary-red);
            color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        
        .input-group-text {
            border-radius: 12px 0 0 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            color: var(--text-dim);
        }

        .btn-danger {
            background-color: var(--primary-red);
            border: none;
            padding: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.3s ease;
        }
        .btn-danger:hover {
            background-color: #ff2a3f;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="brand-title fs-3 mb-2"><i class="bi bi-play-circle-fill"></i> RETROMEDIA</h2>
        <p class="text-muted text-center small mb-4">Ingresa con tus credenciales para acceder a la plataforma.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label small text-light">Correo o Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="usuario" name="usuario" placeholder="usuario@ejemplo.com" required value="invitado@retromedia.com">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label small text-light">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required value="123456">
                </div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 rounded-pill">Ingresar a la plataforma</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
