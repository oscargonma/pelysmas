<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Retromedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #080808;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(8,8,8,0.7), rgba(8,8,8,0.95)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .login-card {
            background-color: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        .brand-title {
            color: #dc3545;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-control {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #222;
            border-color: #dc3545;
            color: #fff;
            box-shadow: none;
        }
        .btn-danger {
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="brand-title fs-3">🎬 RETROMEDIA</h2>
        <p class="text-muted text-center small mb-4">Ingresa cualquier correo y contraseña para acceder a la plataforma.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label small text-light">Correo o Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="usuario" name="usuario" placeholder="usuario@ejemplo.com" required value="invitado@retromedia.com">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label small text-light">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required value="123456">
                </div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 rounded-pill shadow-sm">Ingresar a la plataforma</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
